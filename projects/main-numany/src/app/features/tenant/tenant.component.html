<shared-panel-container titleLabel="Tenants">
  <shared-data-table
    [data]="store.tenants()"
    [columns]="columns"
    [totalRecords]="10"
    [loading]="store.isLoading()"
    [rows]="10"
    
    (lazyLoad)="store.loadTenants($event)"
    
    [tableActions]="true"
    selectionMode="single"
  >
  <div tableActions class="flex justify-end align-items-center gap-4">
    <p-button label="Add Tenant" icon="pi pi-plus" shortcut="alt.i" variant="outlined" (click)="showTenatForm()"></p-button>
    <p-button label="Edit Tenant" icon="pi pi-pencil" shortcut="alt.i" variant="outlined" severity="info"></p-button>
  </div>
</shared-data-table>

</shared-panel-container>

<!-- Add Bed Dialog -->
<p-dialog header="Add a New Tenant" [(visible)]="isAddDialogVisible" [modal]="true" [baseZIndex]="1000">
  <form
    class="grid grid-cols-1 md:grid-cols-2 gap-x-6"
    [formGroup]="tenantForm"
    (ngSubmit)="saveNewTenant()"
  >
    <!-- <div class="flex flex-column gap-3">
      <div class="flex flex-column gap-2">
        <label for="name">Bed Id</label>
        <input pInputText id="name" formControlName="bedId" />
      </div>
      <div class="flex flex-column gap-2">
        <label for="area">Area</label>
        <input pInputText id="area" formControlName="area" />
      </div>
      <div class="flex flex-column gap-2">
        <label for="section">Section</label>
        <input pInputText type="number" id="section" formControlName="section" />
      </div>
    </div> -->

    <div class="min-h-24">
      <app-custom-input
        label="Name"
        type="text"
        formControlName="name"
        [submitted]="isSubmitted"
      ></app-custom-input>
    </div>

    <!-- Area Input (Number) -->
    <div class="min-h-24">
      <app-custom-input
        label="Description"
        placeholder=""
        type="text"
        formControlName="description"
        [submitted]="isSubmitted"
      ></app-custom-input>
    </div>

    <!-- Section Input (Text with minlength) -->
    <div class="min-h-24">
      <app-custom-input
        label="Email Id"
        type="text"
        formControlName="emailId"
        [submitted]="isSubmitted"
      ></app-custom-input>
    </div>

    <div class="min-h-24">
      <app-custom-input
        label="Password"
        type="text"
        formControlName="password"
        [submitted]="isSubmitted"
      ></app-custom-input>
    </div>


    <div class="min-h-24 col-span-2">
      <app-custom-input
        label="Address"
        type="text"
        formControlName="address"
        [submitted]="isSubmitted"
      ></app-custom-input>
    </div>

    <div class="flex flex-col gap-2">
      <label for="expiryDate" class="font-semibold">Expiry Date</label>
      <p-datepicker id="expiryDate" formControlName="expiryDate" appendTo="body"/>
    </div>

    <div class="flex justify-end col-span-2 gap-2 mt-4">
      <p-button
        label="Cancel"
        shortcut="alt.c"
        severity="secondary"
        (click)="isAddDialogVisible = false"
      ></p-button>
      <p-button
        type="submit"
        label="Save"
        shortcut="alt.s"
        
        [loading]="store.isLoading()"
      ></p-button>
    </div>
  </form>
</p-dialog>
