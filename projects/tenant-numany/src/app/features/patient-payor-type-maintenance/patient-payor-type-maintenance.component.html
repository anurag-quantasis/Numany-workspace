<shared-panel-container>
  <div class="mb-4 ml-5 mt-2">
    <h1 class="text-2xl font-semibold">Patient/Payor Type Maintenance</h1>

    <div class="flex items-start justify-between mt-3 ml-0 mb-3 mr-5">
      <p-button label="Print All Records" icon="pi pi-print" variant="outlined"></p-button>
    </div>
  </div>

  <form [formGroup]="form" class="flex flex-col gap-8 mx-5">
    <!-- Filter Dropdown -->
    <div class="w-[290px]">
      <p-select
        formControlName="selectedOption"
        [options]="dropdownOptions"
        optionLabel="name"
        placeholder="Choose an option"
        class="w-full"
      >
      </p-select>
    </div>

    <!-- Type, Name, Address, City -->
    <div class="grid grid-cols-4 gap-6">
      <app-custom-input
        formControlName="idpay"
        label="Patient/Payor Type"
        placeholder="Enter Patient/Payor Type"
        class="w-[250px]"
        pTooltip="Unique 4-digit ID for Payor"
      />
      <app-custom-input
        formControlName="nampay"
        label="Name"
        placeholder="Enter name"
        class="w-[250px]"
        pTooltip="Payor full name"
      />
      <app-custom-input
        formControlName="iadpy"
        label="Address"
        placeholder="Enter address"
        class="w-[250px]"
      />
      <app-custom-input
        formControlName="ictpy"
        label="City"
        placeholder="Enter city"
        class="w-[250px]"
      />
    </div>

    <!-- State, ZIP, Phone, Note -->
    <div class="grid grid-cols-4 gap-6">
      <app-custom-input
        formControlName="istpy"
        label="State"
        placeholder="Enter state"
        class="w-[250px]"
      />
      <app-custom-input
        formControlName="izppy"
        label="Postal/ZIP Code"
        placeholder="Enter ZIP"
        class="w-[250px]"
      />
      <app-custom-input
        formControlName="iphpy"
        label="Phone"
        placeholder="Enter phone number"
        class="w-[250px]"
      />
      <app-custom-input
        formControlName="imspy"
        label="Note"
        placeholder="Enter a note"
        class="w-[250px]"
      />
    </div>

    <!-- Charge Cost Basis, , Cost Basis, Other -->
    <div class="grid grid-cols-4 gap-6">
      <app-custom-input
        formControlName="ipycb"
        label="Charge Cost Basis"
        placeholder="AV, AW, CC or PC"
        class="w-[250px]"
      />
      <app-custom-input
        formControlName="iccpy"
        label="Charge Class"
        placeholder="Enter charge class"
        class="w-[250px]"
        pTooltip="Must match predefined class"
      />
      <div class="mt-7 w-[280px]">
        <p-select
          formControlName="selectedOption"
          [options]="dropdownOptions"
          optionLabel="name"
          placeholder="Choose an option"
          class="w-full"
        >
        </p-select>
      </div>
    </div>

    <!-- Buttons -->
    <div class="flex justify-end gap-4 mb-1">
      <p-button label="Add" (onClick)="onAdd()" variant="outlined" severity="success" />
      <p-button label="Delete" (onClick)="onDelete()" variant="outlined" severity="danger" />
      <p-button label="Update" (onClick)="onUpdate()" variant="outlined" severity="info" />
    </div>
  </form>
</shared-panel-container>
