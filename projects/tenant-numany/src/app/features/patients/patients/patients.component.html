<shared-panel-container>
  <h1 class="mt-3 ml-7 text-2xl font-semibold">PATIENTS SELECTION</h1>

  <div class="flex grid-cols-3">
      <div class="flex gap-6 mt-3 ml-7 items-center w-auto">
    <p-button label="Profile" variant="outlined"></p-button>

    <p-select
      [options]="adtFunctions"
      [(ngModel)]="selectedAdtFunction"
      placeholder="ADT FUNCTIONS"
      (onChange)="onAdtFunctionChange($event.value)"
    ></p-select>

    <p-button label="Auto ADT Labels - ON" variant="outlined" class="w-auto"></p-button>
  </div>
  </div>


  <div class="flex items-center flex-wrap gap-6 mt-5 ml-7">
    <div class="flex gap-2">
      <p-button variant="outlined" icon="pi pi-address-book"></p-button>
      <p-button variant="outlined" icon="pi pi-users"></p-button>
      <p-button variant="outlined" icon="pi pi-file"></p-button>
      <p-button variant="outlined" icon="pi pi-file-edit"></p-button>
      <p-button variant="outlined" icon="pi pi-home"></p-button>
      <p-button variant="outlined" icon="pi pi-arrow-down-right"></p-button>
    </div>

    <form [formGroup]="patientForm" class="flex items-center gap-6 ml-10">
      <div class="flex items-center">
        <p-checkbox inputId="p-checkbox1" formControlName="discharged" binary="true"></p-checkbox>
        <label for="p-checkbox1" class="ml-2">View Discharged</label>
      </div>
      <div class="flex items-center">
        <p-checkbox inputId="p-checkbox2" formControlName="patientsArchived" binary="true"></p-checkbox>
        <label for="p-checkbox2" class="ml-2">Show Archived Patients</label>
      </div>
    </form>
  </div>

  <div class="mt-6 ml-7 mr-7 overflow-x-auto border border-slate-900 rounded-[7px] bg-slate-300">
    <p-table [value]="patients" class="min-w-full text-sm text-left text-gray-700 divide-y divide-gray-200 table-auto">
      <ng-template pTemplate="header">
        <tr>
          <th class="px-4 py-2 whitespace-nowrap">Bed ID</th>
          <th class="px-4 py-2 whitespace-nowrap">Name</th>
          <th class="px-4 py-2 whitespace-nowrap">Patient ID</th>
          <th class="px-4 py-2 whitespace-nowrap">Med Rec No</th>
          <th class="px-4 py-2 whitespace-nowrap">DOB</th>
          <th class="px-4 py-2 whitespace-nowrap">SS#</th>
          <th class="px-4 py-2 whitespace-nowrap">Admitted</th>
          <th class="px-4 py-2 whitespace-nowrap">Discharged</th>
          <th class="px-4 py-2 whitespace-nowrap">Actions</th>
        </tr>
      </ng-template>

      <ng-template pTemplate="body" let-patient>
        <tr>
          <td class="px-4 py-2 whitespace-nowrap">{{ patient.bedId }}</td>
          <td class="px-4 py-2 whitespace-nowrap">{{ patient.name }}</td>
          <td class="px-4 py-2 whitespace-nowrap">{{ patient.patientId }}</td>
          <td class="px-4 py-2 whitespace-nowrap">{{ patient.medRec }}</td>
          <td class="px-4 py-2 whitespace-nowrap">{{ patient.dob | date: 'MM/dd/yyyy' }}</td>
          <td class="px-4 py-2 whitespace-nowrap">{{ patient.ssn }}</td>
          <td class="px-4 py-2 whitespace-nowrap">{{ patient.admitted }}</td>
          <td class="px-4 py-2 whitespace-nowrap">{{ patient.discharged }}</td>
          <td class="px-4 py-2 whitespace-nowrap">
            <p-menu #menu [model]="getActions(patient)" [appendTo]="'body'" [popup]="true"></p-menu>
            <p-button variant="outlined" icon="pi pi-ellipsis-v" (click)="menu.toggle($event)"></p-button> 
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</shared-panel-container>
