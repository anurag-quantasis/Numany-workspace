<form [formGroup]="form">
  <p-table
    [value]="admitRows.controls"
    class="w-full text-sm table-auto bg-slate-300 border border-slate-800"
  >
    <ng-template pTemplate="header">
      <tr>
        <th class="px-4 py-2">Bed ID</th>
        <th class="px-4 py-2">Name</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-row let-i="rowIndex">
      <tr [formGroup]="row">
        <td class="px-4 py-2">
          {{ row.get('bedId')?.value }}
        </td>
        <td class="px-4 py-2">
          {{ row.get('name')?.value }}
        </td>
      </tr>
    </ng-template>
  </p-table>
</form>
