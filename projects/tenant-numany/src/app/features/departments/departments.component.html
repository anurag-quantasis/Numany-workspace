<shared-panel-container titleLabel="Department File Maintenance">
  <main class="flex flex-col w-full gap-y-2">
    <form [formGroup]="departmentForm">
      <!-- The dropdown is now populated from the store's department signal -->
      <p-select
        [options]="store.department()"
        formControlName="department"
        optionLabel="name"
        optionValue="id"
        placeholder="Select a Department to Edit"
        class="w-full md:w-[50%] my-4 flex justify-center items-center"
      />
      <section>
        <div>
          <p-fieldset legend="Department Information">
            <div class="grid grid-cols-4 gap-4">
              <!-- The 'id' field is automatically disabled/enabled by the component logic -->
              <app-custom-input label="Id" type="text" formControlName="id" />
              <app-custom-input label="Name" type="text" formControlName="name" />
              <app-custom-input type="text" label="Address" formControlName="address" />
              <app-custom-input type="text" label="City" formControlName="city" />
              <app-custom-input type="text" label="State" formControlName="state" />
              <app-custom-input type="text" label="Zip" formControlName="zip" />
              <app-custom-input type="text" label="Phone" formControlName="phone" />
            </div>
          </p-fieldset>
          <div
            class="border border-grey-200 p-4.5 mt-5 rounded-md grid md:grid-cols-4 sm:grid-cols-2 gap-4"
          >
            <app-custom-input type="text" label="Note" formControlName="note" />
            <app-custom-input type="text" label="Cost Basis" formControlName="cost_basis" />
            <app-custom-input type="number" label="Markup" formControlName="markup" />
            <app-custom-input type="text" label="Tax Flag" formControlName="tax_flag" />
          </div>
        </div>
      </section>
    </form>

    <div class="flex justify-end items-center gap-x-4 my-5">
      <!-- Standard Mode Buttons: Add, Update, Delete -->
      @if (!isAddMode()) {
        <p-button
          (click)="enterAddMode()"
          [shortcut]="'alt.a'"
          icon="pi pi-plus"
          label="Add"
        ></p-button>
        <p-button
          (click)="updateSelectedDepartment()"
          [disabled]="!departmentForm.get('id')?.value"
          [shortcut]="'alt.u'"
          icon="pi pi-check"
          label="Update"
          variant="outlined"
          severity="info"
        ></p-button>
        <p-button
          (click)="deleteSelectedDepartment()"
          [disabled]="!departmentForm.get('id')?.value"
          [shortcut]="'alt.d'"
          icon="pi pi-trash"
          label="Delete"
          variant="outlined"
          severity="danger"
        ></p-button>
      }

      <!-- Add Mode Buttons: Save, Cancel -->
      @if (isAddMode()) {
        <p-button
          (click)="saveNewDepartment()"
          [disabled]="departmentForm.invalid"
          icon="pi pi-save"
          label="Save"
        ></p-button>
        <p-button
          (click)="cancelAddMode()"
          icon="pi pi-times"
          label="Cancel"
          variant="outlined"
          severity="secondary"
        ></p-button>
      }
    </div>
  </main>
</shared-panel-container>
