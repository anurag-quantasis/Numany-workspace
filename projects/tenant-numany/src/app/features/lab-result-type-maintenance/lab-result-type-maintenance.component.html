<shared-panel-container>
  <div class="p-4">
    <h1 class="text-2xl mt-5 ml-5 font-semibold">Lab Result Type Maintenance</h1>
    <h2 class="text-[16px] mt-3 ml-5 font-semibold">SELECT LAB TYPE TO MODIFY</h2>

    <form [formGroup]="labForm" (ngSubmit)="onSubmit()" class="card flex flex-col gap-4 ml-5 mt-5">

      <!-- Dropdown -->
      <p-dropdown
        [options]="labTypes"
        formControlName="selectedLabType"
        optionLabel="name"
        placeholder="Select Lab Type"
        class="w-[380px]">
      </p-dropdown>

      <!-- Input Fields Grid -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-x-4 gap-y-2 ml-2">
        <div>
          <app-custom-input
            label="Lab ID"
            formControlName="labId"
            placeholder="Enter Lab ID"
            type="text"
            class="w-[360px]">
          </app-custom-input>
        </div>

        <div>
          <app-custom-input
            label="Host ID"
            formControlName="hostId"
            placeholder="Enter Host ID"
            type="text"
            class="w-[360px]">
          </app-custom-input>
        </div>

        <div>
          <app-custom-input
            label="Units"
            formControlName="units"
            placeholder="Enter Units"
            type="text"
            class="w-[360px]">
          </app-custom-input>
        </div>
      </div>

      <!-- Divider -->
      <div class="w-full">
        <p-divider></p-divider>
      </div>

      <!-- Description Textarea -->
      <div class="flex flex-col gap-2 mt-1 mb-3">
        <label for="textarea" class="font-medium">Description</label>
        <textarea
          id="textarea"
          pTextarea
          formControlName="notes"
          rows="5"
          cols="60"
          placeholder="Enter Description..."
          class="p-inputtext w-full max-w-[560px]">
        </textarea>
      </div>

      <!-- Divider -->
      <div class="w-full">
        <p-divider></p-divider>
      </div>

      <!-- Checkbox and Normal Range -->
      <div class="flex items-center gap-6 mt-1">
        <div class="flex items-center gap-2 mt-2">
          <label for="includeReport" class="uppercase font-medium">Include on Report</label>
          <p-checkbox inputId="includeReport" formControlName="includeOnReport" [binary]="true"></p-checkbox>
        </div>

        <div class="flex items-center gap-3 mt-2">
          <label class="uppercase font-medium">Normal Range</label>

          <!-- Low -->
          <div class="flex flex-col items-center">
            <label for="low" class="text-xs font-medium uppercase mt-1">Low</label>
            <input
              id="low"
              type="text"
              pInputText
              formControlName="low"
              placeholder="0"
              class="w-[60px] text-center" />
          </div>

          <!-- High -->
          <div class="flex flex-col items-center">
            <label for="high" class="text-xs font-medium uppercase mt-1">High</label>
            <input
              id="high"
              type="text"
              pInputText
              formControlName="high"
              placeholder="0"
              class="w-[60px] text-center" />
          </div>
        </div>
      </div>

      <!-- Buttons -->
      <div class="flex mb-4 gap-2.5">
        <p-button label="Update" variant="outlined" severity="info" (click)="onUpdate()"></p-button>
        <p-button label="New" variant="outlined" severity="success" (click)="onNew()"></p-button>
        <p-button label="Delete" variant="outlined" severity="danger" (click)="onDelete()"></p-button>
      </div>
    </form>
  </div>
</shared-panel-container>
