<form [formGroup]="interventionForm" class="p-8">
  <!-- <h1 class="text-3xl font-bold text-gray-800 mb-10 ml-6">
    Pharmacist Intervention Table
  </h1> -->

  pharmacist-intervention-type-maintenance

  <div class="grid grid-cols-2 gap-x-15 justify-items-center">
    <!-- Intervention Selection -->
    <div class="w-full">
      <h2 class="text-xl font-medium text-gray-600 mb-2">Select Intervention Data to Add/Modify</h2>
      <p-dropdown
        formControlName="selectedIntervention"
        [options]="interventionOptions"
        optionLabel="name"
        placeholder="Select Intervention"
        class="w-full"
      ></p-dropdown>
    </div>

    <!-- Activity Selection -->
    <div class="w-full">
      <h2 class="text-xl font-medium text-gray-700 mb-2">
        Select &lt;Activity&gt; to Modify or Click &lt;New&gt;
      </h2>

      <div class="flex items-center gap-x-4">
        <p-dropdown
          formControlName="selectedActivity"
          [options]="activityOptions"
          optionLabel="name"
          placeholder="Select Activity"
          class="w-full"
        ></p-dropdown>

        <div class="flex items-center">
          <p-checkbox formControlName="isHidden" [binary]="true"></p-checkbox>
          <label class="ml-2 text-gray-700">Hide</label>
        </div>
      </div>
    </div>
  </div>

  <div class="grid grid-cols-2 gap-x-15 justify-items-center mt-5">
    <div class="w-full">
      <label class="text-gray-800 font-medium text-lg mb-2 block ml-5">ID</label>
      <input
        type="text"
        pInputText
        formControlName="interventionId"
        placeholder="Enter ID"
        class="w-full"
      />
    </div>

    <div class="w-full">
      <label class="text-gray-800 font-medium text-lg mb-2 block ml-5">Description</label>
      <input
        type="text"
        pInputText
        formControlName="description"
        placeholder="Enter Description"
        class="w-full"
      />
    </div>

    <div class="w-full">
      <label class="text-gray-800 font-medium text-lg mb-2 mt-5 block ml-5">Cost Impact</label>
      <input
        type="text"
        pInputText
        formControlName="costImpact"
        placeholder="Enter Cost Impact"
        class="w-full"
      />
    </div>
  </div>

  <div class="flex gap-x-4 mt-15 w-full justify-center">
    <p-button label="New" variant="outlined"></p-button>
    <p-button label="Delete" variant="outlined" severity="danger"></p-button>
    <p-button label="Update" variant="outlined" severity="success"></p-button>
  </div>
</form>
