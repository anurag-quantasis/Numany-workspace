<shared-panel-container>
  <div class="p-4">
    <h1 class="mt-5 ml-2 text-2xl font-semibold">tblVendor</h1>
    <h1 class="mt-3 ml-2 text-slate-800">Select Vendor</h1>

    <form [formGroup]="vendorForm" class="card mt-2 ml-2 p-4 space-y-4">
      <!-- Row 1: Select Vendor, Vendor ID, Account No, Vendor Name -->
      <div class="flex flex-nowrap gap-x-6 overflow-x-auto">
        <!-- Select Vendor -->
        <div class="flex flex-col w-[240px] space-y-2">
          <label for="selectedOption" class="text-gray-700 font-medium">Select Vendor</label>
          <p-select 
            [options]="options" 
            formControlName="selectedOption" 
            optionLabel="name"
            [checkmark]="true"
            [showClear]="true"
            placeholder="Select Vendor"
            class="w-[240px]">
          </p-select>
          <small *ngIf="vendorForm.get('selectedOption')?.touched && vendorForm.get('selectedOption')?.invalid" class="text-red-600">
            Vendor selection is required
          </small>
        </div>

        <!-- Vendor ID -->
        <div class="w-[240px]">
          <app-custom-input
            formControlName="vendorId"
            label="Vendor ID"
            placeholder="Enter vendor ID"
            [disabled]="editingIndex !== null"
            pTooltip="Unique ID for the vendor">
          </app-custom-input>
        </div>

        <!-- Account No -->
        <div class="w-[240px]">
          <app-custom-input
            formControlName="accountNo"
            label="Account No"
            placeholder="Enter account number"
            pTooltip="Max 12 characters">
          </app-custom-input>
        </div>

        <!-- Vendor Name -->
        <div class="w-[240px]">
          <app-custom-input
            formControlName="vendorName"
            label="Vendor Name"
            placeholder="Enter vendor name"
            pTooltip="Full vendor name">
          </app-custom-input>
        </div>
      </div>

      <!-- Divider -->
      <p-divider class="w-full"></p-divider>

      <!-- Row 2: MTD and YTD -->
      <div class="flex flex-nowrap gap-x-6">
        <div class="w-[240px]">
          <app-custom-input
            formControlName="vendorMtd"
            label="MTD"
            placeholder="Enter MTD"
            pTooltip="Month-to-date total">
          </app-custom-input>
        </div>

        <div class="w-[240px]">
          <app-custom-input
            formControlName="vendorYtd"
            label="YTD"
            placeholder="Enter YTD"
            pTooltip="Year-to-date total">
          </app-custom-input>
        </div>
      </div>

      <!-- Row 3: Remarks -->
      <div class="flex flex-col w-[500px] space-y-2">
        <label for="remarks" class="text-gray-700 font-medium">Note</label>
        <textarea
          id="remarks"
          rows="5"
          pTextarea
          formControlName="remarks"
          class="w-full p-inputtext"
        ></textarea>
        <small *ngIf="vendorForm.get('remarks')?.errors?.['maxlength']" class="text-red-600"
          >Max 100 characters</small
        >
      </div>

      <!-- Action Buttons -->
      <div class="flex flex-wrap gap-4 mt-6 justify-end">
        <p-button label="Update" variant="outlined" severity="info" (onClick)="onUpdate()"></p-button>
        <p-button label="Add" variant="outlined" severity="success" (onClick)="onAdd()"></p-button>
        <p-button
          label="Delete"
          variant="outlined"
          severity="danger"
          (onClick)="onDelete()"
        ></p-button>
        <p-button
          label="Refresh"
          variant="outlined"
          severity="secondary"
          (onClick)="onRefresh()"
        ></p-button>
      </div>
    </form>
  </div>
</shared-panel-container>
