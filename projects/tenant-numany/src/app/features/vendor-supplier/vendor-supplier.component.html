<shared-panel-container>
  <h1 class="mt-5 text-2xl font-semibold">tblVendor</h1>

  <form [formGroup]="vendorForm" class="card mt-2 space-y-4">
    <p-fieldset legend="Select Vendor">
      <!-- Row 1 -->
      <div class="flex flex-wrap gap-4">
        <!-- Select Vendor -->
        <div class="flex flex-col w-full md:w-[220px] space-y-2">
          <p-select
            [options]="options"
            formControlName="selectedOption"
            optionLabel="name"
            [checkmark]="true"
            [showClear]="true"
            placeholder="Select Vendor"
            class="w-full mt-8"
          ></p-select>
          <small *ngIf="vendorForm.get('selectedOption')?.touched && vendorForm.get('selectedOption')?.invalid" class="text-red-600">
            Vendor selection is required
          </small>
        </div>

        <!-- Vendor ID -->
        <div class="w-full md:w-[220px]">
          <app-custom-input
            formControlName="vendorId"
            label="Vendor ID"
            placeholder="Enter vendor ID"
            [disabled]="editingIndex !== null"
            pTooltip="Unique ID for the vendor"
          ></app-custom-input>
        </div>

        <!-- Account No -->
        <div class="w-full md:w-[220px]">
          <app-custom-input
            formControlName="accountNo"
            label="Account No"
            placeholder="Enter account number"
            pTooltip="Max 12 characters"
          ></app-custom-input>
        </div>

        <!-- Vendor Name -->
        <div class="w-full md:w-[220px]">
          <app-custom-input
            formControlName="vendorName"
            label="Vendor Name"
            placeholder="Enter vendor name"
            pTooltip="Full vendor name"
          ></app-custom-input>
        </div>
      </div>

      <!-- Row 2 -->
      <div class="flex flex-wrap gap-4">
        <div class="w-full md:w-[220px] mt-3">
          <app-custom-input
            formControlName="vendorMtd"
            label="MTD"
            placeholder="Enter MTD"
            pTooltip="Month-to-date total"
          ></app-custom-input>
        </div>

        <div class="w-full md:w-[220px] mt-3">
          <app-custom-input
            formControlName="vendorYtd"
            label="YTD"
            placeholder="Enter YTD"
            pTooltip="Year-to-date total"
          ></app-custom-input>
        </div>
      </div>

      <!-- Row 3 -->
      <div class="flex flex-col w-full md:w-[500px] mt-3 space-y-2">
        <label for="remarks" class="text-gray-700 font-medium">Note</label>
        <textarea
          id="remarks"
          rows="5"
          pTextarea
          formControlName="remarks"
          class="w-full p-inputtext"
        ></textarea>
        <small *ngIf="vendorForm.get('remarks')?.errors?.['maxlength']" class="text-red-600">
          Max 100 characters
        </small>
      </div>
    </p-fieldset>

    <!-- Action Buttons -->
    <div class="flex flex-wrap gap-4 mt-6 justify-end">
      <p-button label="Update" variant="outlined" severity="info" (onClick)="onUpdate()"></p-button>
      <p-button label="Add" variant="outlined" severity="success" (onClick)="onAdd()"></p-button>
      <p-button label="Delete" variant="outlined" severity="danger" (onClick)="onDelete()"></p-button>
      <p-button label="Refresh" variant="outlined" severity="secondary" (onClick)="onRefresh()"></p-button>
    </div>
  </form>
</shared-panel-container>
