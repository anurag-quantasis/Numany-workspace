<shared-panel-container titleLabel="Standing Order File Maintenance">

        <app-custom-input type="number" formControlName="so_ord7"></app-custom-input>

  </form>

  <section>
    <!-- Main control buttons -->
    <div class="flex justify-center items-center gap-x-4 mt-5">
      <p-button icon="pi pi-plus" label="New"> </p-button>

      <p-button variant="outlined" severity="info" label="Update" icon="pi pi-pencil"> </p-button>

      <p-button variant="outlined" label="Delete" severity="danger" icon="pi pi-trash"> </p-button>
      <p-button label=" CleanUp STDORD" severity="danger" icon="pi pi-trash"> </p-button>
    </div>
