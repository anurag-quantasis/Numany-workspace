<shared-panel-container titleLabel="Charge Parameter Maintenance">
  <main>
    <form [formGroup]="form" class="flex flex-col justify-start items-center gap-x-5">
      <div class="flex mt-4 mb-10 gap-x-10">
        <!-- Change: Corrected [readonly] and added [errorMessages] -->
        <app-custom-input
          label="Class Id"
          type="text"
          [class]="'!w-30 !font-semibold'"
          formControlName="ichid"
          [readonly]="!isAddMode"
          [errorMessages]="{
            required: 'Id is required.',
            maxlength: 'Max 4 characters.',
          }"
        ></app-custom-input>

        <!-- Change: Added [errorMessages] -->
        <app-custom-input
          label="Class Name"
          type="text"
          [class]="'!w-100 !font-semibold'"
          formControlName="namcls"
          [readonly]="!isEdit && !isAddMode"
          [errorMessages]="{
            required: 'Name is required.',
            maxlength: 'Max 50 characters.',
          }"
        ></app-custom-input>
      </div>

      <section class="grid grid-cols-6 gap-5">
        <!-- Grid Headers -->
        <div></div>
        <p class="text-center font-semibold">Low End of Unit Cost Range</p>
        <p class="text-center font-semibold">Hi End of Unit Cost Range</p>
        <p class="text-center font-semibold">Administration Fee</p>
        <p class="text-center font-semibold">Markup Factor</p>
        <p class="text-center font-semibold">Minimum Unit Charge</p>

        <!-- Change: Added [errorMessages] to all numeric inputs below -->
        <p class="font-semibold">Cost Range 1</p>
        <app-custom-input
          type="number"
          formControlName="lo1"
          [readonly]="!isEdit && !isAddMode"
          [errorMessages]="{ required: 'Value is required.', pattern: 'Must be a valid number.' }"
        ></app-custom-input>
        <app-custom-input
          type="number"
          formControlName="hi1"
          [readonly]="!isEdit && !isAddMode"
          [errorMessages]="{ required: 'Value is required.', pattern: 'Must be a valid number.' }"
        ></app-custom-input>
        <app-custom-input
          type="number"
          formControlName="fee1"
          [readonly]="!isEdit && !isAddMode"
          [errorMessages]="{ required: 'Value is required.', pattern: 'Must be a valid number.' }"
        ></app-custom-input>
        <app-custom-input
          type="number"
          formControlName="markup1"
          [readonly]="!isEdit && !isAddMode"
          [errorMessages]="{ required: 'Value is required.', pattern: 'Must be a valid number.' }"
        ></app-custom-input>
        <app-custom-input
          type="number"
          formControlName="minchrg1"
          [readonly]="!isEdit && !isAddMode"
          [errorMessages]="{ required: 'Value is required.', pattern: 'Must be a valid number.' }"
        ></app-custom-input>

        <p class="font-semibold">Cost Range 2</p>
        <app-custom-input
          type="number"
          formControlName="lo2"
          [readonly]="!isEdit && !isAddMode"
          [errorMessages]="{ required: 'Value is required.', pattern: 'Must be a valid number.' }"
        ></app-custom-input>
        <app-custom-input
          type="number"
          formControlName="hi2"
          [readonly]="!isEdit && !isAddMode"
          [errorMessages]="{ required: 'Value is required.', pattern: 'Must be a valid number.' }"
        ></app-custom-input>
        <app-custom-input
          type="number"
          formControlName="fee2"
          [readonly]="!isEdit && !isAddMode"
          [errorMessages]="{ required: 'Value is required.', pattern: 'Must be a valid number.' }"
        ></app-custom-input>
        <app-custom-input
          type="number"
          formControlName="markup2"
          [readonly]="!isEdit && !isAddMode"
          [errorMessages]="{ required: 'Value is required.', pattern: 'Must be a valid number.' }"
        ></app-custom-input>
        <app-custom-input
          type="number"
          formControlName="minchrg2"
          [readonly]="!isEdit && !isAddMode"
          [errorMessages]="{ required: 'Value is required.', pattern: 'Must be a valid number.' }"
        ></app-custom-input>

        <p class="font-semibold">Cost Range 3</p>
        <app-custom-input
          type="number"
          formControlName="lo3"
          [readonly]="!isEdit && !isAddMode"
          [errorMessages]="{ required: 'Value is required.', pattern: 'Must be a valid number.' }"
        ></app-custom-input>
        <app-custom-input
          type="number"
          formControlName="hi3"
          [readonly]="!isEdit && !isAddMode"
          [errorMessages]="{ required: 'Value is required.', pattern: 'Must be a valid number.' }"
        ></app-custom-input>
        <app-custom-input
          type="number"
          formControlName="fee3"
          [readonly]="!isEdit && !isAddMode"
          [errorMessages]="{ required: 'Value is required.', pattern: 'Must be a valid number.' }"
        ></app-custom-input>
        <app-custom-input
          type="number"
          formControlName="markup3"
          [readonly]="!isEdit && !isAddMode"
          [errorMessages]="{ required: 'Value is required.', pattern: 'Must be a valid number.' }"
        ></app-custom-input>
        <app-custom-input
          type="number"
          formControlName="minchrg3"
          [readonly]="!isEdit && !isAddMode"
          [errorMessages]="{ required: 'Value is required.', pattern: 'Must be a valid number.' }"
        ></app-custom-input>

        <p class="font-semibold">Cost Range 4</p>
        <app-custom-input
          type="number"
          formControlName="lo4"
          [readonly]="!isEdit && !isAddMode"
          [errorMessages]="{ required: 'Value is required.', pattern: 'Must be a valid number.' }"
        ></app-custom-input>
        <app-custom-input
          type="number"
          formControlName="hi4"
          [readonly]="!isEdit && !isAddMode"
          [errorMessages]="{ required: 'Value is required.', pattern: 'Must be a valid number.' }"
        ></app-custom-input>
        <app-custom-input
          type="number"
          formControlName="fee4"
          [readonly]="!isEdit && !isAddMode"
          [errorMessages]="{ required: 'Value is required.', pattern: 'Must be a valid number.' }"
        ></app-custom-input>
        <app-custom-input
          type="number"
          formControlName="markup4"
          [readonly]="!isEdit && !isAddMode"
          [errorMessages]="{ required: 'Value is required.', pattern: 'Must be a valid number.' }"
        ></app-custom-input>
        <app-custom-input
          type="number"
          formControlName="minchrg4"
          [readonly]="!isEdit && !isAddMode"
          [errorMessages]="{ required: 'Value is required.', pattern: 'Must be a valid number.' }"
        ></app-custom-input>

        <p class="font-semibold">Cost Range 5</p>
        <app-custom-input
          type="number"
          formControlName="lo5"
          [readonly]="!isEdit && !isAddMode"
          [errorMessages]="{ required: 'Value is required.', pattern: 'Must be a valid number.' }"
        ></app-custom-input>
        <app-custom-input
          type="number"
          formControlName="hi5"
          [readonly]="!isEdit && !isAddMode"
          [errorMessages]="{ required: 'Value is rookie.', pattern: 'Must be a valid number.' }"
        ></app-custom-input>
        <app-custom-input
          type="number"
          formControlName="fee5"
          [readonly]="!isEdit && !isAddMode"
          [errorMessages]="{ required: 'Value is required.', pattern: 'Must be a valid number.' }"
        ></app-custom-input>
        <app-custom-input
          type="number"
          formControlName="markup5"
          [readonly]="!isEdit && !isAddMode"
          [errorMessages]="{ required: 'Value is required.', pattern: 'Must be a valid number.' }"
        ></app-custom-input>
        <app-custom-input
          type="number"
          formControlName="minchrg5"
          [readonly]="!isEdit && !isAddMode"
          [errorMessages]="{ required: 'Value is required.', pattern: 'Must be a valid number.' }"
        ></app-custom-input>
      </section>
    </form>

    <!-- Action buttons section remains unchanged -->
    <section>
      <div class="flex justify-center items-center gap-x-4 mt-5" *ngIf="!isEdit && !isAddMode">
        <p-button label="Add" icon="pi pi-plus" (onClick)="addClicked()"></p-button>
        <p-button
          variant="outlined"
          severity="info"
          label="Edit"
          icon="pi pi-pencil"
          (onClick)="editClicked()"
        ></p-button>
        <p-button
          variant="outlined"
          severity="danger"
          label="Delete"
          icon="pi pi-trash"
          (onClick)="deleteClicked()"
        ></p-button>
        <p-button
          variant="outlined"
          label="Refresh"
          severity="secondary"
          icon="pi pi-refresh"
          (onClick)="refreshClicked()"
        ></p-button>
      </div>
      <div class="flex justify-start items-center gap-x-4 mt-5 ml-44" *ngIf="isEdit || isAddMode">
        <p-button
          severity="info"
          label="Update"
          icon="pi pi-pencil"
          variant="outlined"
          (onClick)="updateClicked()"
        >
        </p-button>
        <p-button
          variant="outlined"
          label="Cancel"
          icon="pi pi-times"
          severity="secondary"
          (onClick)="cancelClicked()"
        ></p-button>
      </div>
      <div class="flex justify-center items-center gap-2 my-5" *ngIf="!isEdit && !isAddMode">
        <p-button
          icon="pi pi-step-backward"
          (onClick)="store.selectRecord(0); isEdit = false"
          [disabled]="store.selectedIndex() === 0 || store.records().length === 0"
        ></p-button>
        <p-button
          icon="pi pi-caret-left"
          (onClick)="prevRecord()"
          [disabled]="store.selectedIndex() === 0 || store.records().length === 0"
        ></p-button>
        <input
          type="text"
          pInputText
          class="h-full w-100 text-center"
          readonly
          [value]="'Record: ' + (form.get('namcls')?.value || '')"
        />
        <p-button
          icon="pi pi-caret-right"
          (onClick)="nextRecord()"
          [disabled]="
            store.selectedIndex() === store.records().length - 1 || store.records().length === 0
          "
        ></p-button>
        <p-button
          icon="pi pi-step-forward"
          (onClick)="store.selectRecord(store.records().length - 1); isEdit = false"
          [disabled]="
            store.selectedIndex() === store.records().length - 1 || store.records().length === 0
          "
        ></p-button>
      </div>
    </section>
  </main>
  <div>
    <p-confirmDialog #cd key="delete-chargeParameter-confirmation" [style]="{ width: '450px' }">
      <ng-template pTemplate="footer">
        <div class="flex justify-end gap-2">
          <button
            pButton
            type="button"
            label="Cancel"
            severity="secondary"
            outlined="true"
            shortcut="alt.c"
            (click)="cd.onReject()"
          ></button>
          <button
            pButton
            type="button"
            label="Delete"
            severity="danger"
            shortcut="alt.d"
            (click)="cd.onAccept()"
          ></button>
        </div>
      </ng-template>
    </p-confirmDialog>
  </div>
</shared-panel-container>
