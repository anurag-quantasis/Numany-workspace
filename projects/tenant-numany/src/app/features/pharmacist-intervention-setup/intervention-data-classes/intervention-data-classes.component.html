<!-- intervention-data-classes.component.html -->
<form [formGroup]="interventionForm" class="p-8">
  <div class="grid grid-cols-2 gap-x-15 justify-items-center">
    <!-- Intervention Selection -->
    <div class="w-full">
      <h2 class="text-xl font-medium text-gray-600 mb-2">Select Intervention Data to Add/Modify</h2>
      <p-dropdown
        formControlName="table_type"
        [options]="interventionOptions"
        optionLabel="name"
        placeholder="Select Intervention"
        class="w-full"
      ></p-dropdown>
    </div>

    <!-- Activity Selection -->
    <div class="w-full">
      <h2 class="text-xl font-medium text-gray-700 mb-2">Select to Modify or Click</h2>

      <div class="flex items-center gap-x-4">
        <p-dropdown
          formControlName="item_type"
          [options]="activityOptions()"
          optionLabel="name"
          optionValue="code"
          placeholder="Select Activity"
          class="w-[320px]"
        ></p-dropdown>

        <div class="flex items-center gap-x-2">
          <p-checkbox formControlName="hide" [binary]="true"></p-checkbox>
          <label class="text-gray-700">Hide</label>
        </div>
      </div>
    </div>
  </div>

  <div class="grid grid-cols-2 gap-x-15 justify-items-center mt-5">
    <app-custom-input
      label="ID"
      pInputText
      formControlName="id"
      placeholder="Enter ID"
      class="border-none shadow-none"
    >
    </app-custom-input>

    <div class="w-full">
      <app-custom-input
        label="Description"
        type="text"
        pInputText
        formControlName="description"
        placeholder="Enter Description"
        class="border-none shadow-none"
      >
      </app-custom-input>
    </div>

    <div class="w-full">
      <app-custom-input
        label="Cost Impact"
        type="number"
        pInputText
        formControlName="value"
        placeholder="Enter Cost Impact"
        class="border-none shadow-none"
      >
      </app-custom-input>
    </div>
  </div>

  <!-- Button controls with conditional logic -->
  <div class="flex gap-x-4 mt-5 w-full justify-end">
    @if (!isNewMode()) {
      <p-button label="New" icon="pi pi-plus" (click)="onNew()"></p-button>
      <p-button
        label="Update"
        variant="outlined"
        severity="info"
        icon="pi pi-check"
        (click)="onUpdate()"
        [disabled]="!interventionForm.get('id')?.value"
      ></p-button>
      <p-button
        label="Delete"
        variant="outlined"
        severity="danger"
        icon="pi pi-trash"
        (click)="onDelete()"
        [disabled]="!interventionForm.get('id')?.value"
      ></p-button>
    } @else {
      <p-button
        label="Save"
        icon="pi pi-save"
        (click)="onSave()"
        [disabled]="interventionForm.invalid"
      ></p-button>
      <p-button
        label="Cancel"
        variant="outlined"
        severity="secondary"
        icon="pi pi-times"
        (click)="onCancel()"
      ></p-button>
    }
  </div>
</form>
