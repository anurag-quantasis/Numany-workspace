<shared-panel-container [title]="'Pharmacist Intervention Table Maintenance'">
  <h2 class="ml-10 mt-3 text-lg text-gray-700">Select Intervention Type to Modify</h2>

  <form [formGroup]="interventionForm" class="ml-10 mt-5">
    <div class="grid grid-cols-2 gap-x-20 justify-items-start w-full">
      <div class="w-full">
        <p-dropdown
          formControlName="selectedIntervention"
          [options]="interventionOptions"
          optionLabel="name"
          placeholder="Select Intervention"
          class="w-full"
          (onChange)="onInterventionSelect()"
        ></p-dropdown>
      </div>
    </div>

          <div class="flex items-center gap-3">
            <p-checkbox formControlName="Acuity" [binary]="true" inputId="acuity"></p-checkbox>
            <label for="acuity" class="text-gray-700 cursor-pointer">Acuity</label>
          </div>

          <div class="flex items-center gap-3">
            <p-checkbox formControlName="FI" [binary]="true" inputId="drugImpactFinancial"></p-checkbox>
            <label for="drugImpactFinancial" class="text-gray-700 cursor-pointer">Drug Impact - Financial</label>
          </div>

          <div class="flex items-center gap-3">
            <p-checkbox formControlName="OC" [binary]="true" inputId="interventionOutcome"></p-checkbox>
            <label for="interventionOutcome" class="text-gray-700 cursor-pointer">Intervention Outcome</label>
          </div>
        </div>
      </p-fieldset>
    </div>

    <!-- Action Buttons -->
    <div class="flex justify-end gap-4 mt-5">
      <p-button label="New" variant="outlined" severity="success" (click)="onNew()" icon="pi pi-plus"></p-button>
      <p-button label="Delete" variant="outlined" severity="danger" (click)="onDelete()" icon="pi pi-trash"></p-button>
      <p-button label="Update" variant="outlined" severity="info" (click)="onUpdate()" icon="pi pi-check"></p-button>
    </div>
  </div>
</shared-panel-container>
