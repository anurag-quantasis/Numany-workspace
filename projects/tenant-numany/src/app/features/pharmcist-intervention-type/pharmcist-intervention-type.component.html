<shared-panel-container>
  <h1 class="mt-3 text-2xl">Pharmacist Intervention Type</h1>
  <h2 class="mt-3 text-lg text-gray-700">Select Intervention Type to Modify</h2>

  <div [formGroup]="interventionForm" class="mt-5 pr-5 text-left w-full">
    <div class="grid grid-cols-2 gap-x-20 justify-items-start w-full">
<p-dropdown
  formControlName="selectedIntervention"
  [options]="interventionOptions"
  optionLabel="name"
  placeholder="Select Intervention"
  class="w-full mb-3"
>
  <ng-template let-option pTemplate="item">
    <div class="flex justify-between w-full">
      <span>{{ option.name }}</span>
      <span class="text-gray-500 ml-4">{{ option.id }}</span>
    </div>
  </ng-template>
</p-dropdown>


    </div>

    <div class="border border-grey-200 p-4 mt-5 rounded-md grid md:grid-cols-4 sm:grid-cols-2 gap-4">
      <div class="flex gap-10">
        <div class="flex flex-col items-start gap-4 mb-6">
          <label class="text-lg font-medium text-gray-700 w-10">ID</label>
          <input
            type="text"
            pInputText
            class="w-[220px]"
            formControlName="PI_ID"
            placeholder="Enter ID"
          />
        </div>

        <div class="flex flex-col items-start gap-4 mb-6">
          <label class="text-lg font-medium text-gray-700 w-32">Description</label>
          <input
            type="text"
            pInputText
            formControlName="Description"
            placeholder="Enter activity description"
            class="w-[450px]"
          />
        </div>

        <div class="flex items-center ml-3 mt-3">
          <p-checkbox formControlName="PI_Hide" [binary]="true"></p-checkbox>
          <label class="ml-2 text-gray-700 cursor-pointer">Hide</label>
        </div>
      </div>
    </div>

    <div class="mt-3">
      <p-fieldset legend="Include on Intervention Entry Form">
        <div class="grid grid-cols-3 gap-4 w-full mb-6">
          <div class="flex items-center">
            <p-checkbox formControlName="SL_ME" [binary]="true" inputId="medErrorSeverity"></p-checkbox>
            <label for="medErrorSeverity" class="ml-2 text-gray-700 cursor-pointer">Med Error Severity Level</label>
          </div>

          <div class="flex items-center">
            <p-checkbox formControlName="CL_ME" [binary]="true" inputId="medErrorClass"></p-checkbox>
            <label for="medErrorClass" class="ml-2 text-gray-700 cursor-pointer">Med Error Class</label>
          </div>

          <div class="flex items-center">
            <p-checkbox formControlName="SC_ME" [binary]="true" inputId="medErrorSubclass"></p-checkbox>
            <label for="medErrorSubclass" class="ml-2 text-gray-700 cursor-pointer">Med Error Subclass</label>
          </div>

          <div class="flex items-center">
            <p-checkbox formControlName="PC_ME" [binary]="true" inputId="probableCause"></p-checkbox>
            <label for="probableCause" class="ml-2 text-gray-700 cursor-pointer">Probable Cause</label>
          </div>

          <div class="flex items-center">
            <p-checkbox formControlName="SL_ADR" [binary]="true" inputId="adrSeverity"></p-checkbox>
            <label for="adrSeverity" class="ml-2 text-gray-700 cursor-pointer">ADR Severity Level</label>
          </div>

          <div class="flex items-center">
            <p-checkbox formControlName="ADRType" [binary]="true" inputId="adrCertainty"></p-checkbox>
            <label for="adrCertainty" class="ml-2 text-gray-700 cursor-pointer">ADR Certainty Level</label>
          </div>

          <div class="flex items-center">
            <p-checkbox formControlName="Acuity" [binary]="true" inputId="acuity"></p-checkbox>
            <label for="acuity" class="ml-2 text-gray-700 cursor-pointer">Acuity</label>
          </div>

          <div class="flex items-center">
            <p-checkbox formControlName="FI" [binary]="true" inputId="drugImpactFinancial"></p-checkbox>
            <label for="drugImpactFinancial" class="ml-2 text-gray-700 cursor-pointer">Drug Impact - Financial</label>
          </div>

          <div class="flex items-center">
            <p-checkbox formControlName="OC" [binary]="true" inputId="interventionOutcome"></p-checkbox>
            <label for="interventionOutcome" class="ml-2 text-gray-700 cursor-pointer">Intervention Outcome</label>
          </div>
        </div>
      </p-fieldset>
    </div>

    <div class="flex gap-x-4 mt-5 justify-end">
      <p-button label="New" variant="outlined" (click)="onNew()"></p-button>
      <p-button label="Delete" variant="outlined" severity="danger" (click)="onDelete()"></p-button>
      <p-button label="Update" variant="outlined" severity="success" (click)="onUpdate()"></p-button>
    </div>
  </div>
</shared-panel-container>
